<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRIMA - Prueba de Escáner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f4f6f8;
      text-align: center;
    }

    .card {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
    }

    h1 {
      margin-bottom: 8px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #1565c0;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #resultado {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #eeeeee;
      font-size: 18px;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>TRIMA</h1>
  <p>Prueba de lector de código de barras</p>

  <button onclick="iniciarScanner()">
    📷 ABRIR CÁMARA
  </button>

  <div id="reader"></div>

  <div id="resultado">
    Esperando código...
  </div>

</div>

<script>

let scanner = null;
let procesado = false;

const formatosTRIMA = [
  Html5QrcodeSupportedFormats.EAN_13,
  Html5QrcodeSupportedFormats.EAN_8,
  Html5QrcodeSupportedFormats.UPC_A,
  Html5QrcodeSupportedFormats.UPC_E,
  Html5QrcodeSupportedFormats.CODE_128,
  Html5QrcodeSupportedFormats.CODE_39
];

function iniciarScanner() {

  const resultado = document.getElementById("resultado");

  resultado.innerHTML =
    "Solicitando acceso a la cámara...";

  procesado = false;

  scanner = new Html5Qrcode(
    "reader",
    {
      formatsToSupport: formatosTRIMA,
      verbose: false
    }
  );

  const configuracion = {
    fps: 15,

    qrbox: function(width, height) {

      const ancho =
        Math.floor(width * 0.90);

      const alto =
        Math.floor(height * 0.30);

      return {
        width: ancho,
        height: alto
      };
    },

    aspectRatio: 1.777778
  };

  scanner.start(

    { facingMode: "environment" },

    configuracion,

    function(codigoDetectado, decodedResult) {

      if (procesado) return;

      procesado = true;

      resultado.innerHTML =
        "✅ <strong>CÓDIGO DETECTADO</strong><br><br>" +
        codigoDetectado;

      if (decodedResult &&
          decodedResult.result &&
          decodedResult.result.format) {

        resultado.innerHTML +=
          "<br><br>Formato: " +
          decodedResult.result.format.formatName;
      }

      scanner.stop()
        .then(function() {
          scanner.clear();
        })
        .catch(function() {});

    },

    function(errorLectura) {
      // Es normal recibir errores mientras
      // todavía no hay un código enfocado.
    }

  )

  .then(function() {

    resultado.innerHTML =
      "📷 <strong>Cámara lista</strong><br>" +
      "Apunta al código de barras";

  })

  .catch(function(error) {

    resultado.innerHTML =
      "❌ <strong>ERROR DE CÁMARA</strong><br><br>" +
      String(error);

  });

}

</script>

</body>
</html>
