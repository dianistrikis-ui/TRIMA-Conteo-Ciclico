<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>TRIMA - Lector de Código de Barras</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
      text-align: center;
    }

    .card {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
    }

    h1 {
      margin: 5px 0;
      font-size: 34px;
    }

    .subtitulo {
      font-size: 20px;
      margin: 8px 0 22px;
    }

    button {
      width: 100%;
      padding: 18px;
      margin: 8px 0 18px;
      border: 0;
      border-radius: 12px;
      background: #1769c2;
      color: white;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    #reader video {
      width: 100% !important;
      object-fit: cover;
    }

    #estado {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: #f1f1f1;
      font-size: 18px;
      line-height: 1.45;
    }

    #resultado {
      display: none;
      margin-top: 18px;
      padding: 20px;
      border-radius: 12px;
      background: #e7f7eb;
      font-size: 18px;
    }

    #codigoDetectado {
      display: block;
      margin-top: 8px;
      font-size: 28px;
      font-weight: bold;
      word-break: break-all;
    }

    .marcoTexto {
      margin: 10px 0;
      font-size: 15px;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>TRIMA</h1>

    <div class="subtitulo">
      Lector de código de barras
    </div>

    <button id="btnCamara" onclick="abrirCamara()">
      📷 ESCANEAR CÓDIGO
    </button>

    <div class="marcoTexto">
      Coloca el código de barras dentro del área de lectura.
    </div>

    <div id="reader"></div>

    <div id="estado">
      Listo para escanear.
    </div>

    <div id="resultado">
      ✅ <strong>CÓDIGO DETECTADO</strong>
      <span id="codigoDetectado"></span>
    </div>

  </div>

<script>

let scanner = null;
let scannerActivo = false;
let codigoProcesado = false;


/* =========================================================
   FORMATOS QUE NOS INTERESAN
   ========================================================= */

const formatosTRIMA = [
  Html5QrcodeSupportedFormats.EAN_13,
  Html5QrcodeSupportedFormats.EAN_8,
  Html5QrcodeSupportedFormats.UPC_A,
  Html5QrcodeSupportedFormats.UPC_E,
  Html5QrcodeSupportedFormats.CODE_128,
  Html5QrcodeSupportedFormats.CODE_39,
  Html5QrcodeSupportedFormats.CODE_93,
  Html5QrcodeSupportedFormats.ITF,
  Html5QrcodeSupportedFormats.CODABAR
];


/* =========================================================
   ABRIR CÁMARA
   ========================================================= */

async function abrirCamara() {

  const estado = document.getElementById("estado");
  const boton = document.getElementById("btnCamara");
  const resultado = document.getElementById("resultado");

  if (scannerActivo) {
    return;
  }

  boton.disabled = true;
  resultado.style.display = "none";

  codigoProcesado = false;

  estado.innerHTML =
    "🔎 <strong>Preparando lector...</strong><br>" +
    "Buscando automáticamente la mejor cámara trasera.";

  try {

    /* -----------------------------------------
       1. PEDIMOS PERMISO Y OBTENEMOS CÁMARAS
       ----------------------------------------- */

    const cameras = await Html5Qrcode.getCameras();

    if (!cameras || cameras.length === 0) {
      throw new Error("No se encontraron cámaras disponibles.");
    }


    /* -----------------------------------------
       2. BUSCAMOS UNA CÁMARA TRASERA
       ----------------------------------------- */

    let camarasTraseras = cameras.filter(function(cam) {

      const nombre = String(cam.label || "").toLowerCase();

      return (
        nombre.includes("back") ||
        nombre.includes("rear") ||
        nombre.includes("environment") ||
        nombre.includes("trasera") ||
        nombre.includes("ultra") ||
        nombre.includes("wide")
      );

    });


    /*
      Si Safari no proporciona nombres útiles,
      utilizamos las cámaras disponibles como respaldo.
    */

    if (camarasTraseras.length === 0) {
      camarasTraseras = cameras;
    }


    /* -----------------------------------------
       3. PRIORIZAMOS CÁMARAS ÚTILES PARA
          LECTURA CERCANA
       ----------------------------------------- */

    function puntajeCamara(cam) {

      const nombre = String(cam.label || "").toLowerCase();

      let puntos = 0;

      if (nombre.includes("back")) puntos += 30;
      if (nombre.includes("rear")) puntos += 30;
      if (nombre.includes("environment")) puntos += 30;

      /*
        En nuestras pruebas el Ultra Wide del iPhone
        funciona bien a corta distancia.
      */

      if (nombre.includes("ultra")) puntos += 50;
      if (nombre.includes("0.5")) puntos += 50;

      if (nombre.includes("wide")) puntos += 20;

      /*
        Penalizamos cámara frontal.
      */

      if (nombre.includes("front")) puntos -= 100;
      if (nombre.includes("user")) puntos -= 100;

      return puntos;
    }


    camarasTraseras.sort(function(a, b) {
      return puntajeCamara(b) - puntajeCamara(a);
    });


    const camaraElegida = camarasTraseras[0];


    /* -----------------------------------------
       4. CREAMOS EL LECTOR
       ----------------------------------------- */

    scanner = new Html5Qrcode(
      "reader",
      {
        formatsToSupport: formatosTRIMA,
        verbose: false
      }
    );


    const configuracion = {

      fps: 15,

      qrbox: function(viewfinderWidth, viewfinderHeight) {

        /*
          Área horizontal grande para códigos de barras.
        */

        const width =
          Math.floor(viewfinderWidth * 0.90);

        const height =
          Math.min(
            Math.floor(viewfinderHeight * 0.35),
            220
          );

        return {
          width: width,
          height: height
        };
      },

      /*
        Esta opción permite utilizar capacidades
        experimentales del navegador cuando existan.
      */

      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    };


    /* -----------------------------------------
       5. INICIAMOS LA CÁMARA ELEGIDA
       ----------------------------------------- */

    await scanner.start(

      camaraElegida.id,

      configuracion,

      function(codigo, decodedResult) {

        codigoLeido(codigo, decodedResult);

      },

      function(errorLectura) {

        /*
          Estos errores son normales mientras
          todavía no encuentra un código.
        */

      }

    );


    scannerActivo = true;

    boton.disabled = false;

    estado.innerHTML =
      "📷 <strong>Cámara activa</strong><br>" +
      "Acerca o aleja lentamente el producto.<br>" +
      "La lectura es automática.";


    /* -----------------------------------------
       6. INTENTAMOS ACTIVAR ENFOQUE CONTINUO
          SI EL IPHONE LO PERMITE
       ----------------------------------------- */

    intentarEnfoqueContinuo();


  } catch(error) {

    scannerActivo = false;
    boton.disabled = false;

    estado.innerHTML =
      "❌ <strong>No fue posible iniciar el lector.</strong><br><br>" +
      String(error);

    console.error(error);
  }
}


/* =========================================================
   INTENTAR AUTOFOCUS
   ========================================================= */

async function intentarEnfoqueContinuo() {

  try {

    const video =
      document.querySelector("#reader video");

    if (!video || !video.srcObject) {
      return;
    }

    const tracks =
      video.srcObject.getVideoTracks();

    if (!tracks.length) {
      return;
    }

    const track = tracks[0];

    const capabilities =
      track.getCapabilities
        ? track.getCapabilities()
        : {};


    /*
      Algunos dispositivos permiten pedir
      enfoque continuo desde el navegador.
    */

    if (
      capabilities.focusMode &&
      capabilities.focusMode.includes("continuous")
    ) {

      await track.applyConstraints({
        advanced: [
          {
            focusMode: "continuous"
          }
        ]
      });

    }

  } catch(error) {

    /*
      No es un error crítico.
      Si Safari no lo admite simplemente continúa.
    */

    console.log(
      "Enfoque automático no disponible:",
      error
    );
  }
}


/* =========================================================
   CUANDO DETECTA UN CÓDIGO
   ========================================================= */

function codigoLeido(codigo, decodedResult) {

  if (codigoProcesado) {
    return;
  }

  codigoProcesado = true;

  const estado =
    document.getElementById("estado");

  const resultado =
    document.getElementById("resultado");

  const codigoElemento =
    document.getElementById("codigoDetectado");


  codigoElemento.textContent = codigo;

  resultado.style.display = "block";

  estado.innerHTML =
    "🎯 <strong>Lectura realizada correctamente.</strong>";


  /*
    Vibración corta como confirmación
    cuando el iPhone/navegador lo permita.
  */

  try {

    if (navigator.vibrate) {
      navigator.vibrate(120);
    }

  } catch(error) {}


  /* Cerramos la cámara después de leer */

  detenerScanner();

}


/* =========================================================
   DETENER LECTOR
   ========================================================= */

async function detenerScanner() {

  if (!scanner) {
    scannerActivo = false;
    return;
  }

  try {

    if (scannerActivo) {
      await scanner.stop();
    }

  } catch(error) {

    console.log(error);

  }

  try {

    await scanner.clear();

  } catch(error) {}


  scannerActivo = false;

  document.getElementById("btnCamara").disabled = false;
}

</script>

</body>
</html>
