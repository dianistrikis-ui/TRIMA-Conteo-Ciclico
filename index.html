<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>TRIMA - Prueba ZXing</title>

  <!-- MOTOR ZXING -->
  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
      text-align: center;
    }

    .card {
      max-width: 500px;
      margin: auto;
      padding: 22px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
    }

    h1 {
      margin-bottom: 5px;
    }

    button {
      width: 100%;
      padding: 17px;
      margin: 15px 0;
      border: none;
      border-radius: 12px;
      background: #1769c2;
      color: white;
      font-size: 19px;
      font-weight: bold;
    }

    .visor {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: black;
    }

    video {
      width: 100%;
      display: block;
    }

    .linea {
      position: absolute;
      left: 7%;
      right: 7%;
      top: 50%;
      height: 3px;
      background: red;
    }

    #estado {
      margin-top: 16px;
      padding: 15px;
      border-radius: 10px;
      background: #eeeeee;
      font-size: 17px;
    }

    #resultado {
      display: none;
      margin-top: 16px;
      padding: 20px;
      border-radius: 10px;
      background: #e6f6ea;
    }

    #codigo {
      display: block;
      margin-top: 10px;
      font-size: 28px;
      font-weight: bold;
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>TRIMA</h1>

  <p>Prueba ZXing — Código de barras</p>

  <button onclick="iniciar()">
    📷 ESCANEAR CÓDIGO
  </button>

  <div class="visor">
    <video id="video"
           autoplay
           muted
           playsinline>
    </video>

    <div class="linea"></div>
  </div>

  <div id="estado">
    Listo para escanear.
  </div>

  <div id="resultado">
    ✅ <strong>CÓDIGO DETECTADO</strong>
    <span id="codigo"></span>
  </div>

</div>


<script>

let controles = null;
let detectado = false;


async function iniciar() {

  const estado =
    document.getElementById("estado");

  const resultado =
    document.getElementById("resultado");

  const video =
    document.getElementById("video");


  detectado = false;

  resultado.style.display = "none";

  estado.innerHTML =
    "📷 Abriendo cámara...";


  try {

    /*
      ZXing especializado en códigos 1D:
      EAN, UPC, CODE 128, CODE 39, etc.
    */

    const lector =
      new ZXingBrowser.BrowserMultiFormatOneDReader();


    /*
      Pedimos directamente una cámara trasera.
      Safari decide la cámara física disponible.
    */

    controles =
      await lector.decodeFromConstraints(

        {
          video: {
            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            }
          }
        },

        video,

        function(resultadoZXing, error, controls) {

          if (!resultadoZXing || detectado) {
            return;
          }


          detectado = true;


          const texto =
            resultadoZXing.getText();


          document.getElementById("codigo")
            .textContent = texto;


          resultado.style.display =
            "block";


          estado.innerHTML =
            "🎯 <strong>¡Código leído!</strong>";


          /*
            Detenemos cámara después
            de reconocer el código.
          */

          try {
            controls.stop();
          } catch(e) {}

        }

      );


    estado.innerHTML =
      "🔎 <strong>Lector activo</strong><br>" +
      "Coloca las barras atravesando la línea roja.";


  } catch(error) {

    estado.innerHTML =
      "❌ <strong>Error:</strong><br>" +
      String(error);

  }

}

</script>

</body>
</html>
