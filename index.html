<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TRIMA - Diagnóstico Cámara</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
      text-align: center;
    }

    .card {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
    }

    h1 {
      margin-bottom: 5px;
    }

    select,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin-top: 12px;
      border-radius: 10px;
      font-size: 17px;
    }

    select {
      border: 1px solid #ccc;
      background: white;
    }

    button {
      border: none;
      background: #1565c0;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #reader {
      width: 100%;
      margin-top: 18px;
    }

    #resultado {
      margin-top: 18px;
      padding: 15px;
      background: #eeeeee;
      border-radius: 10px;
      font-size: 17px;
      word-break: break-word;
    }

    #info {
      margin-top: 12px;
      font-size: 14px;
      color: #555;
      text-align: left;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>TRIMA</h1>
  <p>Diagnóstico de cámara</p>

  <button onclick="detectarCamaras()">
    📷 DETECTAR CÁMARAS
  </button>

  <select id="listaCamaras">
    <option value="">
      Primero detecta las cámaras
    </option>
  </select>

  <button onclick="iniciarScanner()">
    🔎 USAR CÁMARA SELECCIONADA
  </button>

  <div id="reader"></div>

  <div id="resultado">
    Esperando...
  </div>

  <div id="info"></div>

</div>


<script>

let scanner = null;
let scannerActivo = false;
let procesado = false;


const formatosTRIMA = [

  Html5QrcodeSupportedFormats.EAN_13,
  Html5QrcodeSupportedFormats.EAN_8,
  Html5QrcodeSupportedFormats.UPC_A,
  Html5QrcodeSupportedFormats.UPC_E,
  Html5QrcodeSupportedFormats.CODE_128,
  Html5QrcodeSupportedFormats.CODE_39

];


function detectarCamaras() {

  const resultado =
    document.getElementById("resultado");

  const lista =
    document.getElementById("listaCamaras");

  const info =
    document.getElementById("info");


  resultado.innerHTML =
    "Solicitando acceso a las cámaras...";


  Html5Qrcode.getCameras()

  .then(function(camaras) {

    lista.innerHTML = "";

    if (!camaras || camaras.length === 0) {

      resultado.innerHTML =
        "❌ No se encontraron cámaras.";

      return;
    }


    camaras.forEach(function(camara, indice) {

      const opcion =
        document.createElement("option");

      opcion.value = camara.id;

      opcion.textContent =
        (indice + 1) +
        " - " +
        (camara.label || "Cámara");

      lista.appendChild(opcion);

    });


    resultado.innerHTML =
      "✅ <strong>" +
      camaras.length +
      " cámara(s) encontrada(s)</strong><br>" +
      "Selecciona una cámara.";

    info.innerHTML =
      "Cámaras detectadas:<br><br>" +
      camaras.map(function(camara, indice) {

        return (indice + 1) +
          ". " +
          (camara.label || "Sin nombre");

      }).join("<br>");

  })

  .catch(function(error) {

    resultado.innerHTML =
      "❌ <strong>Error al detectar cámaras</strong><br><br>" +
      String(error);

  });

}



function iniciarScanner() {

  const resultado =
    document.getElementById("resultado");

  const lista =
    document.getElementById("listaCamaras");

  const cameraId =
    lista.value;


  if (!cameraId) {

    resultado.innerHTML =
      "Primero pulsa DETECTAR CÁMARAS.";

    return;

  }


  if (scannerActivo && scanner) {

    scanner.stop()
      .then(function() {

        scanner.clear();

        scannerActivo = false;

        abrirCamara(cameraId);

      })
      .catch(function() {

        scannerActivo = false;

        abrirCamara(cameraId);

      });

  } else {

    abrirCamara(cameraId);

  }

}



function abrirCamara(cameraId) {

  const resultado =
    document.getElementById("resultado");


  procesado = false;


  scanner =
    new Html5Qrcode(
      "reader",
      {
        formatsToSupport: formatosTRIMA,
        verbose: false
      }
    );


  const configuracion = {

    fps: 15,

    qrbox: function(width, height) {

      return {

        width:
          Math.floor(width * 0.92),

        height:
          Math.floor(height * 0.32)

      };

    },

    aspectRatio: 1.777778

  };


  resultado.innerHTML =
    "Abriendo cámara seleccionada...";


  scanner.start(

    cameraId,

    configuracion,

    function(codigo, decodedResult) {

      if (procesado) return;

      procesado = true;


      resultado.innerHTML =
        "✅ <strong>CÓDIGO DETECTADO</strong>" +
        "<br><br>" +
        codigo;


      if (
        decodedResult &&
        decodedResult.result &&
        decodedResult.result.format
      ) {

        resultado.innerHTML +=
          "<br><br>Formato: " +
          decodedResult.result.format.formatName;

      }


      scanner.stop()

      .then(function() {

        scannerActivo = false;
        scanner.clear();

      })

      .catch(function() {});

    },


    function(errorLectura) {

      // Normal mientras busca un código.

    }

  )

  .then(function() {

    scannerActivo = true;

    resultado.innerHTML =
      "📷 <strong>Cámara activa</strong><br>" +
      "Comprueba primero si la imagen está enfocada.";

  })

  .catch(function(error) {

    scannerActivo = false;

    resultado.innerHTML =
      "❌ <strong>Error al abrir cámara</strong>" +
      "<br><br>" +
      String(error);

  });

}

</script>

</body>
</html>
