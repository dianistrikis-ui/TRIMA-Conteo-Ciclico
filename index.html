<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>TRIMA - Lector de códigos</title>

<script src="https://unpkg.com/@zxing/browser@latest"></script>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
  }

  .app {
    max-width: 520px;
    margin: auto;
    padding: 20px;
  }

  h1 {
    text-align: center;
    margin-bottom: 4px;
  }

  .subtitulo {
    text-align: center;
    color: #666;
    margin-top: 0;
  }

  button {
    width: 100%;
    padding: 17px;
    border: 0;
    border-radius: 12px;
    background: #1769c2;
    color: white;
    font-size: 19px;
    font-weight: bold;
    margin: 12px 0;
  }

  #visor {
    display: none;
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    background: black;
  }

  video {
    width: 100%;
    display: block;
    min-height: 360px;
    object-fit: cover;
  }

  .marco {
    position: absolute;
    left: 6%;
    right: 6%;
    top: 38%;
    height: 24%;
    border: 4px solid white;
    border-left-width: 7px;
    border-right-width: 7px;
    pointer-events: none;
  }

  .linea {
    position: absolute;
    left: 9%;
    right: 9%;
    top: 50%;
    height: 3px;
    background: red;
    pointer-events: none;
  }

  #estado {
    margin-top: 15px;
    padding: 16px;
    border-radius: 12px;
    background: white;
    text-align: center;
    line-height: 1.5;
  }

  #resultado {
    display: none;
    margin-top: 15px;
    padding: 22px;
    border-radius: 12px;
    background: #e6f6ea;
    text-align: center;
  }

  #codigo {
    display: block;
    font-size: 30px;
    font-weight: bold;
    margin-top: 10px;
    word-break: break-all;
  }

  #detalle {
    margin-top: 10px;
    font-size: 13px;
    color: #777;
  }
</style>
</head>

<body>

<div class="app">

  <h1>TRIMA</h1>
  <p class="subtitulo">Lector de código de barras</p>

  <button id="btnAbrir" onclick="iniciarScanner()">
    📷 ESCANEAR CÓDIGO
  </button>

  <div id="visor">
    <video id="video"
           autoplay
           muted
           playsinline>
    </video>

    <div class="marco"></div>
    <div class="linea"></div>
  </div>

  <div id="estado">
    Listo para escanear.
  </div>

  <div id="resultado">
    ✅ <strong>CÓDIGO DETECTADO</strong>
    <span id="codigo"></span>
  </div>

  <div id="detalle"></div>

</div>

<script>

let stream = null;
let controles = null;
let detectado = false;


/* ===============================
   DETENER TODO
================================ */

function detenerScanner() {

  try {
    if (controles) {
      controles.stop();
      controles = null;
    }
  } catch(e) {}

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
}


/* ===============================
   INICIAR CÁMARA
================================ */

async function iniciarScanner() {

  detenerScanner();

  detectado = false;

  const video =
    document.getElementById("video");

  const visor =
    document.getElementById("visor");

  const estado =
    document.getElementById("estado");

  const resultado =
    document.getElementById("resultado");

  const detalle =
    document.getElementById("detalle");

  resultado.style.display = "none";
  visor.style.display = "block";
  detalle.innerHTML = "";

  estado.innerHTML =
    "📷 Abriendo cámara trasera...";


  try {

    /* ---------------------------------
       1. PEDIR CÁMARA TRASERA
    ---------------------------------- */

    stream =
      await navigator.mediaDevices.getUserMedia({

        audio: false,

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          },

          frameRate: {
            ideal: 30
          }

        }

      });


    video.srcObject = stream;

    await video.play();


    /* ---------------------------------
       2. OBTENER TRACK REAL
    ---------------------------------- */

    const track =
      stream.getVideoTracks()[0];

    let capabilities = {};

    if (typeof track.getCapabilities === "function") {
      capabilities = track.getCapabilities();
    }


    /* ---------------------------------
       3. INTENTAR ENFOQUE CONTINUO
    ---------------------------------- */

    const advanced = [];


    if (
      capabilities.focusMode &&
      Array.isArray(capabilities.focusMode) &&
      capabilities.focusMode.includes("continuous")
    ) {

      advanced.push({
        focusMode: "continuous"
      });

    }


    /*
       Si Safari expone zoom,
       usamos un aumento MUY ligero.
       Esto puede ayudar a que el código
       ocupe más píxeles sin obligarnos
       a acercar demasiado el teléfono.
    */

    if (
      capabilities.zoom &&
      typeof capabilities.zoom.min === "number" &&
      typeof capabilities.zoom.max === "number"
    ) {

      let zoomDeseado =
        Math.max(capabilities.zoom.min, 1.2);

      zoomDeseado =
        Math.min(zoomDeseado, capabilities.zoom.max);

      advanced.push({
        zoom: zoomDeseado
      });

    }


    if (advanced.length > 0) {

      try {

        await track.applyConstraints({
          advanced: advanced
        });

      } catch(e) {

        console.log(
          "Safari no aplicó constraints avanzados:",
          e
        );

      }

    }


    /* ---------------------------------
       4. MOSTRAR CONFIGURACIÓN REAL
    ---------------------------------- */

    const settings =
      typeof track.getSettings === "function"
      ? track.getSettings()
      : {};


    detalle.innerHTML =
      "Cámara: " +
      (track.label || "trasera") +
      "<br>" +
      "Resolución: " +
      (settings.width || "?") +
      " × " +
      (settings.height || "?");


    estado.innerHTML =
      "🔎 <strong>Lector activo</strong><br>" +
      "Mantén el código dentro del marco.";


    /* ---------------------------------
       5. ENTREGAR STREAM A ZXING
    ---------------------------------- */

    const lector =
      new ZXingBrowser.BrowserMultiFormatReader();


    controles =
      await lector.decodeFromStream(

        stream,

        video,

        function(resultadoZXing, error, controlActual) {

          if (
            !resultadoZXing ||
            detectado
          ) {
            return;
          }


          const texto =
            resultadoZXing.getText();


          if (!texto) {
            return;
          }


          detectado = true;


          document.getElementById("codigo")
            .textContent = texto;


          resultado.style.display =
            "block";


          estado.innerHTML =
            "🎯 <strong>Código leído correctamente</strong>";


          try {
            controlActual.stop();
          } catch(e) {}


          setTimeout(function() {

            if (stream) {

              stream
                .getTracks()
                .forEach(t => t.stop());

            }

          }, 300);

        }

      );


  } catch(error) {

    console.error(error);

    estado.innerHTML =
      "❌ No fue posible iniciar el lector.<br><br>" +
      error.name +
      ": " +
      error.message;

  }

}


/* ===============================
   LIMPIEZA AL SALIR
================================ */

window.addEventListener(
  "pagehide",
  detenerScanner
);

</script>

</body>
</html>
