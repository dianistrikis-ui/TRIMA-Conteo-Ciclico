<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRIMA - Prueba de Escáner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f4f6f8;
      text-align: center;
    }

    .card {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
    }

    h1 {
      margin-bottom: 8px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #1565c0;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #resultado {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #eeeeee;
      font-size: 18px;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>TRIMA</h1>
    <p>Prueba de lector de código de barras</p>

    <button onclick="iniciarScanner()">
      📷 ABRIR CÁMARA
    </button>

    <div id="reader"></div>

    <div id="resultado">
      Esperando código...
    </div>
  </div>

<script>

let scanner = null;
let procesado = false;

function iniciarScanner() {

  document.getElementById("resultado").innerText =
    "Solicitando acceso a la cámara...";

  scanner = new Html5Qrcode("reader");
  procesado = false;

  scanner.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: function(width, height) {
        return {
          width: Math.floor(width * 0.85),
          height: Math.floor(height * 0.35)
        };
      }
    },

    function(codigo) {

      if (procesado) return;
      procesado = true;

      document.getElementById("resultado").innerHTML =
        "<strong>CÓDIGO DETECTADO:</strong><br>" + codigo;

      scanner.stop().then(function() {
        scanner.clear();
      });

    },

    function(errorLectura) {
      // Se ignoran los intentos sin lectura.
    }
  )

  .catch(function(error) {

    document.getElementById("resultado").innerHTML =
      "<strong>ERROR DE CÁMARA:</strong><br>" +
      String(error);

  });

}

</script>

</body>
</html>
